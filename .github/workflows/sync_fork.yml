name: Fork Sync

permissions:
  contents: write
  workflows: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Sync Upstream
        run: gh repo sync ${{ github.repository }} --force
